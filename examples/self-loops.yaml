meta:
  title: Self-loops
  path: examples/self-loops
  description: Demonstrates steps where from and to are the same node — internal work, retries, recursive processing — plus broadcasts and multi-data steps.

flow:
  nodes:
    - id: client
      label: Client
      type: actor
    - id: api
      label: API Gateway
      type: endpoint
    - id: worker
      label: Worker
      type: service
    - id: cache
      label: Cache
      type: cache
    - id: db
      label: Database
      type: database

  steps:
    - from: client
      to: api
      data: The client submits a new background job to the API gateway and asks it to be queued.

    # Self-loop with multiple data payloads sent at once — three independent
    # checks fire on the same internal step.
    - from: api
      to: api
      data:
        - label: The API runs schema validation on the incoming body to make sure the request is well-formed.
          fields:
            - name: body
              type: JSON
        - label: The API verifies the caller's token to confirm they're allowed to enqueue this job.
          fields:
            - name: token
              type: JWT
        - label: The API checks its rate-limit bucket for this caller so a single client can't overwhelm the workers.
          fields:
            - name: bucket
              type: string

    # Broadcast: API fans out to both worker and cache in a single step.
    - from: api
      to: [worker, cache]
      data: The API hands the job to a worker for processing and stashes a pending record in the cache for fast status lookups.

    # Self-loop with multi-data: worker reports retry + metric in parallel.
    - from: worker
      to: worker
      data:
        - label: The worker processes the batch, retrying up to three times with exponential backoff if a step fails.
          fields:
            - name: attempt
              type: int
              changed: true
            - name: backoff_ms
              type: int
        - label: While processing, the worker emits internal timing and throughput metrics for the observability stack.
          fields:
            - name: latency_ms
              type: float
            - name: throughput
              type: int

    # Broadcast write: worker writes to db and invalidates cache at once.
    - from: worker
      to: [db, cache]
      data: The worker writes the final result to the database and invalidates the cache entry so the next reader gets the fresh data.

    # Self-loop on the database: trigger fires a follow-up update.
    - from: db
      to: db
      data: A database trigger fires automatically and updates the audit log to record this change.

    # Multiple sources delivering to the same node at once — worker reports
    # completion while cache confirms invalidation; api receives both in parallel.
    - parallel:
        - from: worker
          to: api
          data:
            label: The worker tells the API the job has finished and reports how long it took.
            fields:
              - name: job_id
                type: uuid
              - name: duration_ms
                type: int
        - from: cache
          to: api
          data:
            label: The cache confirms back to the API how many stale entries were evicted as part of the invalidation.
            fields:
              - name: keys_evicted
                type: int
    - from: api
      to: client
      data: The API tells the client the job completed successfully and returns a 200.
