meta:
  title: AI Browsing Agent
  description: A user asks an AI agent to research something on the web; the agent drives a real browser, summarizes the result through an LLM, and caches the answer.
  path: agents/ai-browsing-agent

flow:
  nodes:
    - id: user
      label: User
      type: actor
    - id: agent
      label: AI Agent
      type: ai_agent
    - id: memory
      label: Conversation
      type: cache
    - id: llm
      label: LLM
      type: external
      icon: "simple-icons:openai"
    - id: browser
      label: Browser
      type: browser
    - id: web
      label: Website
      type: external
      icon: "logos:google-icon"

  steps:
    - from: user
      to: agent
      data:
        label: The user asks the agent a natural-language research question along with how deep to go.
        fields:
          - name: prompt
            type: string
          - name: max_steps
            type: int

    - from: agent
      to: memory
      data: The agent appends the new turn to the running conversation buffer so the LLM has the full thread on every step.

    - from: memory
      to: llm
      data:
        label: The agent calls the LLM with the conversation history and the tool schema, asking it to decide the next action.
        fields:
          - name: messages
          - name: tools
            type: "list[Tool]"

    - from: llm
      to: agent
      data:
        label: The model returns a structured action — typically open_url, click, or extract_text — with the arguments to use.
        fields:
          - name: action
            type: string
          - name: args
            type: dict

    - from: agent
      to: browser
      data:
        label: The agent translates the chosen action into a browser command and dispatches it through the controller.
        fields:
          - name: action
            type: string
          - name: args
            type: dict

    - from: browser
      to: web
      data: The browser navigates to the target URL or clicks the indexed element on the live page.

    - from: web
      to: browser
      data:
        label: The page loads or mutates; the browser waits for network-idle before snapshotting the new DOM.
        fields:
          - name: html
            type: string
          - name: screenshot
            type: bytes

    - from: browser
      to: agent
      data:
        label: The browser returns the indexed element tree plus a screenshot the model can reference on the next step.
        fields:
          - name: elements
            type: "list[InteractiveElement]"
          - name: screenshot
            type: bytes

    - from: agent
      to: agent
      data: If the model didn't emit `done` and max_steps isn't reached, the agent loops back to the LLM with the new page state.

    - from: agent
      to: memory
      data: When the model finally emits `done`, the agent stores the final answer alongside the visited URLs for future recall.

    - from: agent
      to: user
      data:
        label: The agent returns the summarized answer with citations to the user.
        fields:
          - name: answer
            type: string
          - name: sources
            type: "list[string]"
