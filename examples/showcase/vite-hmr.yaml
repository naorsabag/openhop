meta:
  title: Vite HMR — one edit to one painted pixel
  path: showcase/vite-hmr
  description: A developer saves a source file; Vite's HMR pipeline turns that into a precise client-side patch without reloading the page.

flow:
  nodes:
    - id: dev
      label: Developer
      type: actor
    - id: editor
      label: Editor
      type: actor
    - id: fs
      label: File System
      type: external
    - id: watcher
      label: chokidar Watcher
      type: service
    - id: server
      label: Dev Server
      type: service
    - id: graph
      label: Module Graph
      type: cache
    - id: plugins
      label: Plugin Pipeline
      type: service
    - id: ws
      label: HMR WebSocket
      type: queue
    - id: client
      label: vite/client
      type: service
    - id: browser
      label: Browser
      type: actor

  steps:
    - from: dev
      to: editor
      data: The developer saves an edit to a source module.
    - from: editor
      to: fs
      data: The editor writes the new contents to disk.
    - from: fs
      to: watcher
      data: chokidar fires a change event for the modified path.
    - from: watcher
      to: server
      data: The watcher debounces and notifies the dev server with the absolute file path.
    - from: server
      to: graph
      data: The server looks the file up in the module graph to find the corresponding node and its importers.
    - from: graph
      to: server
      data:
        label: The graph returns the affected module plus the chain of importers that need to be considered.
        fields:
          - name: mod
            type: ModuleNode
          - name: importers
            type: "list[ModuleNode]"
    - from: server
      to: plugins
      data: The server invokes the handleHotUpdate hook on every plugin so they can refine or replace the affected module list.
    - from: plugins
      to: server
      data: Plugins return a possibly narrowed list of modules to update — e.g. only the <style> block of a Vue SFC.
    - from: server
      to: graph
      data: The server invalidates each affected module so the next fetch produces a fresh transform.
    - from: server
      to: ws
      data:
        label: The server publishes an update payload over the HMR channel listing what each importer should do.
        fields:
          - name: type
            type: "'update'"
          - name: updates
            type: "list[Update]"
    - from: ws
      to: client
      data: The vite/client runtime receives the update message in the browser.
    - from: client
      to: server
      data: For each js-update, the client fetches the new module via a regular dev-server request with an updated timestamp query.
    - from: server
      to: client
      data: The server runs the transform pipeline on the requested module and streams back the new JS.
    - from: client
      to: browser
      data: The client swaps the module in place using each module's import.meta.hot.accept callbacks, with no full reload.
    - from: client
      to: browser
      data: For css-update, the client patches the existing <style> link's href so the browser fetches the new stylesheet and repaints.
