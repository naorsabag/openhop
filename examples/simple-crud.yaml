meta:
  title: Simple CRUD
  path: examples/crud
  description: Basic REST API CRUD operations

flow:
  nodes:
    - id: client
      label: Client
      type: actor
    - id: api
      label: REST API
      type: endpoint
    - id: db
      label: Database
      type: database

  steps:
    - from: client
      to: api
      data: The client submits a new item with its name and quantity to the REST API.
    - from: api
      to: db
      data: The API translates the incoming request into an insert and writes a new row.
    - from: db
      to: api
      data: The database returns the newly created row along with its generated identifier.
    - from: api
      to: client
      data: The API confirms back to the client that the item was created successfully.
