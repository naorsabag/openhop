meta:
  title: Create Order
  description: End-to-end order creation flow with payment processing
  path: e-commerce/orders

flow:
  nodes:
    - id: user
      label: User
      type: actor
    - id: api
      label: API Gateway
      type: endpoint
    - id: authz
      label: Auth Service
      type: auth
    - id: rate-limit
      label: Rate Limit
      type: service
    - id: order-service
      label: Order Service
      type: service
      flow:
        nodes:
          - id: validate
            label: Validate
            type: service
          - id: enrich
            label: Enrich
            type: service
        steps:
          - from: validate
            to: enrich
            data:
              label: The validator hands the cleaned-up order to enrichment so missing pricing and tax details can be filled in.
              fields:
                - name: items
                  type: "list[OrderItem]"
                - name: user_id
                  type: int
                - name: valid
                  type: bool
                  added: true
    - id: db
      label: PostgreSQL
      type: database
      icon: "logos:postgresql"
      color: "#336791"
    - id: cache
      label: Redis
      type: cache
      icon: "logos:redis"
      color: "#DC382D"
    - id: payment
      label: Stripe
      type: external
      icon: "logos:stripe"
      color: "#635BFF"
    - id: events
      label: Order Events
      type: queue
    - id: cron
      label: Retry Scheduler
      type: scheduler

  steps:
    - from: user
      to: api
      data:
        label: The shopper submits a new order with their cart items, account ID, and any coupon they're applying.
        fields:
          - name: items
            type: "list[OrderItem]"
          - name: user_id
            type: int
          - name: coupon_code
            type: string

    - from: api
      to: authz
      data:
        label: The gateway forwards the user's session credentials to the auth service to confirm they're really signed in.
        fields:
          - name: auth_token
            type: string
          - name: user_id
            type: int

    - from: authz
      to: api
      data:
        label: The auth service confirms the session is valid and hands back the user's roles so the gateway can decide what they're allowed to do.
        fields:
          - name: user_id
            type: int
          - name: roles
            type: "list[string]"
            added: true
          - name: session_valid
            type: bool
            added: true

    - from: api
      to: rate-limit
      data:
        label: The gateway asks the rate-limit service whether this user has any quota left for placing orders.
        fields:
          - name: user_id
            type: int
          - name: request_path
            type: string

    - from: rate-limit
      to: api
      data:
        label: The rate-limit service approves the request and reports how many orders this user can still place in the current window.
        fields:
          - name: remaining_requests
            type: int
            added: true

    - parallel:
        - from: api
          to: order-service
          data:
            label: The gateway hands the actual order details to the order service so the real processing can begin.
            fields:
              - name: items
                type: "list[OrderItem]"
              - name: user_id
                type: int
              - name: coupon_code
                type: string
        - from: authz
          to: order-service
          data:
            label: At the same time, the auth service forwards the user's verified identity and roles directly to the order service so it doesn't have to re-check.
            fields:
              - name: user_id
                type: int
              - name: roles
                type: "list[string]"
              - name: session_valid
                type: bool

    - from: api
      to: order-service
      data:
        label: The gateway also attaches a trace identifier and the edge region it came from so the order service can correlate logs across the request.
        fields:
          - name: request_id
            type: string
            added: true
          - name: edge_region
            type: string
            added: true

    - from: order-service
      to: [db, cache]
      data:
        label: The order service persists the finalized order to Postgres and warms the Redis cache so future status lookups are fast.
        fields:
          - name: order
            type: Order
          - name: total
            type: float
            added: true
          - name: coupon_code
            removed: true

    - parallel:
        - from: db
          to: order-service
          data:
            label: Postgres confirms the write and returns the new order's identifier and creation timestamp.
            fields:
              - name: order_id
                type: int
                added: true
              - name: created_at
                type: datetime
                added: true
        - from: cache
          to: order-service
          data:
            label: Redis confirms the cache entry was stored and is ready to serve.
            fields:
              - name: cached
                type: bool

    - from: order-service
      to: payment
      data:
        - label: The order service asks Stripe to charge the customer's card for the order total.
          fields:
            - name: amount
              type: float
            - name: currency
              type: string
        - label: Alongside the charge, the order service sends the order's context so Stripe can attach it to the transaction for reconciliation later.
          fields:
            - name: order_id
              type: int
            - name: items_count
              type: int

    - from: payment
      to: order-service
      data:
        - label: Stripe answers with the result of the charge — the new payment identifier and whether it succeeded.
          fields:
            - name: payment_id
              type: string
              added: true
            - name: status
              type: string
              added: true
        - label: Along with the result, Stripe returns the financial breakdown so the merchant knows how much actually landed in their account after fees.
          fields:
            - name: amount
              type: float
            - name: fee
              type: float
              added: true
            - name: net
              type: float
              added: true
      drilldown: true

    # Create temp audit logger — receives order event data
    - create: audit
      from: order-service
      node:
        id: audit
        label: Audit Log
        type: service
      data:
        label: The order service spins up a temporary audit logger for this specific transaction so the compliance trail can be written without blocking the response.
        fields:
          - name: order_id
            type: int
          - name: event
            type: string
          - name: trace_id
            type: string
            added: true

    # Destroy after logging
    - destroy: audit

    # Fan out an async event so downstream consumers can react to the new order.
    - from: order-service
      to: events
      data:
        label: The order service publishes an "order created" event to the queue so downstream systems like fulfillment, analytics, and email can react asynchronously.
        fields:
          - name: order_id
            type: int
          - name: user_id
            type: int
          - name: total
            type: float

    # Periodic retry scheduler checks for stuck orders and nudges the service.
    - from: cron
      to: order-service
      data:
        label: On a fixed schedule, the retry scheduler sweeps the order service for orders that got stuck and asks it to try them again.
        fields:
          - name: since
            type: datetime
          - name: batch_size
            type: int

    - from: order-service
      to: api
      data:
        label: The order service tells the gateway the order is done and returns everything the user needs to see — order ID, total, status, and payment reference.
        fields:
          - name: order_id
            type: int
          - name: total
            type: float
          - name: status
            type: string
          - name: payment_id
            type: string

    - from: api
      to: user
      data:
        label: The gateway responds to the shopper confirming their order was placed successfully and shows them the order details.
        fields:
          - name: order_id
            type: int
          - name: total
            type: float
          - name: status
            type: string
