meta:
  title: Create Order
  description: End-to-end order creation flow with payment processing
  path: e-commerce/orders
  tags: [orders, payments, e-commerce]

flow:
  nodes:
    - id: user
      label: User
      type: actor
    - id: api
      label: API Gateway
      type: endpoint
    - id: order-service
      label: Order Service
      type: service
      flow:
        nodes:
          - id: validate
            label: Validate
            type: transform
          - id: enrich
            label: Enrich
            type: transform
        steps:
          - from: validate
            to: enrich
            data:
              label: validated order
              fields:
                - name: items
                  type: "list[OrderItem]"
                - name: user_id
                  type: int
                - name: valid
                  type: bool
                  added: true
    - id: db
      label: PostgreSQL
      type: custom
      icon: "logos:postgresql"
      color: "#336791"
    - id: cache
      label: Redis
      type: custom
      icon: "logos:redis"
      color: "#DC382D"
    - id: payment
      label: Stripe
      type: custom
      icon: "logos:stripe"
      color: "#635BFF"

  steps:
    - from: user
      to: api
      data:
        label: POST /orders
        fields:
          - name: items
            type: "list[OrderItem]"
          - name: user_id
            type: int
          - name: coupon_code
            type: string

    - from: api
      to: order-service
      data:
        label: create order
        fields:
          - name: items
            type: "list[OrderItem]"
          - name: user_id
            type: int
          - name: coupon_code
            type: string

    - from: order-service
      to: [db, cache]
      data:
        label: persist order
        fields:
          - name: order
            type: Order
          - name: total
            type: float
            added: true
          - name: coupon_code
            removed: true

    - parallel:
        - from: db
          to: order-service
          data:
            label: order saved
            fields:
              - name: order_id
                type: int
                added: true
              - name: created_at
                type: datetime
                added: true
        - from: cache
          to: order-service
          data:
            label: cache updated
            fields:
              - name: cached
                type: bool

    - from: order-service
      to: payment
      data:
        label: charge customer
        fields:
          - name: amount
            type: float
          - name: currency
            type: string
          - name: order_id
            type: int

    - from: payment
      to: order-service
      data:
        label: payment confirmed
        fields:
          - name: payment_id
            type: string
            added: true
          - name: status
            type: string
            added: true
          - name: amount
            type: float
      drilldown: true

    - from: order-service
      to: api
      data:
        label: order response
        fields:
          - name: order_id
            type: int
          - name: total
            type: float
          - name: status
            type: string
          - name: payment_id
            type: string

    - from: api
      to: user
      data:
        label: "201 Created"
        fields:
          - name: order_id
            type: int
          - name: total
            type: float
          - name: status
            type: string
