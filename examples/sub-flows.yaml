meta:
  title: Sub-flows
  path: examples/sub-flows
  description: A service node with a nested flow — click "+" on the service to drill in

flow:
  nodes:
    - id: client
      label: Client
      type: actor
    - id: api
      label: API
      type: endpoint

    # Any node can carry a nested `flow:` block. The renderer shows
    # a "+" badge on the node; clicking it zooms the canvas into
    # this sub-flow's nodes + steps. Infinite depth supported.
    - id: order-service
      label: Order Service
      type: service
      flow:
        nodes:
          - id: validate
            label: Validate
            type: service
          - id: enrich
            label: Enrich
            type: service
          - id: persist
            label: Persist
            type: service
        steps:
          - from: validate
            to: enrich
            data: The validator hands the cleaned-up request off to enrichment so missing fields can be filled in.
          - from: enrich
            to: persist
            data:
              label: Enrichment passes the fully-populated record to persistence so it can be written to long-term storage.
              fields:
                - name: items
                  type: list
                - name: user_id
                  type: int
                  added: true

    - id: db
      label: Postgres
      type: database

  steps:
    - from: client
      to: api
      data: The client submits a new order with the cart items and shipping address.
    # `drilldown: true` auto-opens the sub-flow during playback when
    # the camera lands on this step. Use sparingly — once per flow
    # is usually enough; chained drilldowns get disorienting.
    - from: api
      to: order-service
      data: The API hands the request to the order service for the real processing work.
      drilldown: true
    - from: order-service
      to: db
      data: The order service writes the finalized order to the database.
    - from: db
      to: order-service
      data: The database confirms the write and returns the new order's identifier.
    - from: order-service
      to: api
      data: The order service tells the API that the order was placed and returns its ID.
    - from: api
      to: client
      data: The API confirms back to the client that their order was created successfully.
