name: publish

# Publishes @openhop/web and the openhop CLI to npm whenever the version in
# either package.json on master differs from what's already on the registry
# under the `beta` tag. Lets us ship a release just by merging a "chore: bump"
# PR — no manual `npm publish` step in someone's terminal.
#
# Web is published before CLI because the CLI's package.json depends on the
# web version. If only one bumped, only that one runs (the other is a no-op).

on:
  push:
    branches: [master]
    paths:
      - "packages/web/package.json"
      - "packages/cli/package.json"
      - "packages/cli/src/index.ts"
      - "packages/server/package.json"
  workflow_dispatch:

permissions:
  contents: write # tag + release creation
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci

      - name: Resolve target versions
        id: versions
        run: |
          web_version=$(node -p "require('./packages/web/package.json').version")
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          echo "web=$web_version" >> "$GITHUB_OUTPUT"
          echo "cli=$cli_version" >> "$GITHUB_OUTPUT"

      - name: Check if @openhop/web@${{ steps.versions.outputs.web }} is already on npm
        id: web_status
        run: |
          if npm view "@openhop/web@${{ steps.versions.outputs.web }}" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@openhop/web@${{ steps.versions.outputs.web }} already on registry, skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if openhop@${{ steps.versions.outputs.cli }} is already on npm
        id: cli_status
        run: |
          if npm view "openhop@${{ steps.versions.outputs.cli }}" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::openhop@${{ steps.versions.outputs.cli }} already on registry, skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Publish web first — the CLI's package.json depends on the web version.
      - name: Publish @openhop/web
        if: steps.web_status.outputs.publish == 'true'
        working-directory: packages/web
        run: npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish openhop CLI
        if: steps.cli_status.outputs.publish == 'true'
        working-directory: packages/cli
        run: npm publish --tag beta --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tag + GitHub Release whenever ANY publish happened. The tag tracks
      # the CLI version since that's the user-visible artifact (`npx
      # openhop@beta …`); the release notes list whatever shipped this run
      # so a web-only or cli-only bump is still recorded.
      - name: Create tag + GitHub Release
        if: |
          steps.web_status.outputs.publish == 'true' ||
          steps.cli_status.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_VERSION: ${{ steps.versions.outputs.web }}
          CLI_VERSION: ${{ steps.versions.outputs.cli }}
          WEB_PUBLISHED: ${{ steps.web_status.outputs.publish }}
          CLI_PUBLISHED: ${{ steps.cli_status.outputs.publish }}
        run: |
          tag="v$CLI_VERSION"
          # If the tag already exists (rare — re-running a workflow on a
          # commit whose CLI version was already tagged), skip cleanly.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::release $tag already exists, skipping"
            exit 0
          fi

          {
            echo "## Published to npm (\`beta\` tag)"
            if [ "$WEB_PUBLISHED" = "true" ]; then
              echo "- [\`@openhop/web@$WEB_VERSION\`](https://www.npmjs.com/package/@openhop/web/v/$WEB_VERSION)"
            fi
            if [ "$CLI_PUBLISHED" = "true" ]; then
              echo "- [\`openhop@$CLI_VERSION\`](https://www.npmjs.com/package/openhop/v/$CLI_VERSION)"
            fi
            echo
            echo "## Try it"
            echo '```sh'
            echo "npx openhop@beta demo"
            echo '```'
            echo
            echo "Auto-generated notes (commit history) below."
          } > /tmp/release-body.md

          gh release create "$tag" \
            --title "$tag" \
            --notes-file /tmp/release-body.md \
            --generate-notes \
            --target "$GITHUB_SHA"
