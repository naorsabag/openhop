name: publish

# Publishes @openhop/server, @openhop/web, and the openhop CLI to npm whenever
# the version in any of their package.json files on master differs from what's
# already on the registry. Lets us ship a release just by merging a
# "chore: bump" PR — no manual `npm publish` step in someone's terminal.
#
# `npm publish` (no --tag) sets the `latest` dist-tag, so the npmjs.com
# page + `npm install <pkg>` (no @beta suffix) get the new version on every
# successful publish — no separate dist-tag promote step needed.
#
# Order matters: server + web ship before the CLI because the CLI's
# package.json depends on both. If only one bumped, only that one runs (the
# others are no-ops).

on:
  push:
    branches: [master]
    paths:
      - "packages/web/package.json"
      - "packages/cli/package.json"
      - "packages/cli/src/index.ts"
      - "packages/server/package.json"
  workflow_dispatch:

permissions:
  contents: write # tag + release creation
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 LTS bundles
      # npm 10.x, so upgrade globally before `npm ci` so all later npm
      # invocations (including publish) use the new version.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci

      # Preflight for OIDC trusted publishing. There is no long-lived
      # NPM_TOKEN anymore — each run mints a short-lived OIDC token from
      # GitHub, which npm exchanges with the registry. The two things that
      # can break:
      #   1. The workflow lost `permissions: id-token: write` (no OIDC
      #      endpoint exposed -> ACTIONS_ID_TOKEN_REQUEST_URL is unset).
      #   2. npm CLI is too old to know how to do the exchange.
      # Both surface here, instead of as an opaque registry rejection
      # halfway through a publish.
      #
      # To (re)configure the npm side: npmjs.com -> each package
      # (@openhop/server, @openhop/web, openhop) -> Settings -> Trusted
      # Publisher -> GitHub Actions, with repo `naorsabag/openhop` and
      # workflow `publish.yml`.
      - name: Verify OIDC trusted publishing is wired up
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC unavailable — workflow is missing 'permissions: id-token: write'."
            exit 1
          fi
          npm_version=$(npm --version)
          # `sort -V -C` returns success iff the input is already version-sorted,
          # so feeding "11.5.1\n$npm_version" succeeds iff $npm_version >= 11.5.1.
          if ! printf '%s\n' "11.5.1" "$npm_version" | sort -V -C; then
            echo "::error::npm $npm_version is too old for OIDC trusted publishing — need >=11.5.1."
            exit 1
          fi
          echo "::notice::OIDC ready, npm $npm_version"

      - name: Resolve target versions
        id: versions
        run: |
          server_version=$(node -p "require('./packages/server/package.json').version")
          web_version=$(node -p "require('./packages/web/package.json').version")
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          echo "server=$server_version" >> "$GITHUB_OUTPUT"
          echo "web=$web_version" >> "$GITHUB_OUTPUT"
          echo "cli=$cli_version" >> "$GITHUB_OUTPUT"

      - name: Check if @openhop/server@${{ steps.versions.outputs.server }} is already on npm
        id: server_status
        run: |
          if npm view "@openhop/server@${{ steps.versions.outputs.server }}" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@openhop/server@${{ steps.versions.outputs.server }} already on registry, skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if @openhop/web@${{ steps.versions.outputs.web }} is already on npm
        id: web_status
        run: |
          if npm view "@openhop/web@${{ steps.versions.outputs.web }}" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@openhop/web@${{ steps.versions.outputs.web }} already on registry, skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if openhop@${{ steps.versions.outputs.cli }} is already on npm
        id: cli_status
        run: |
          if npm view "openhop@${{ steps.versions.outputs.cli }}" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::openhop@${{ steps.versions.outputs.cli }} already on registry, skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Server + web ship before the CLI — the CLI's package.json pins both.
      - name: Publish @openhop/server
        id: publish_server
        if: steps.server_status.outputs.publish == 'true'
        working-directory: packages/server
        # No env: OIDC handles auth via id-token. npm >=11.5.1 also
        # auto-attaches a signed provenance attestation on trusted-publishing
        # runs — no --provenance flag needed.
        run: npm publish --access public

      - name: Publish @openhop/web
        id: publish_web
        if: steps.web_status.outputs.publish == 'true'
        working-directory: packages/web
        # No env: OIDC handles auth via id-token. npm >=11.5.1 also
        # auto-attaches a signed provenance attestation on trusted-publishing
        # runs — no --provenance flag needed.
        run: npm publish --access public

      - name: Publish openhop CLI
        id: publish_cli
        if: steps.cli_status.outputs.publish == 'true'
        working-directory: packages/cli
        # No env: OIDC handles auth via id-token. npm >=11.5.1 also
        # auto-attaches a signed provenance attestation on trusted-publishing
        # runs — no --provenance flag needed.
        run: npm publish --access public

      # Tag + GitHub Release whenever ANY publish happened. Tag scheme
      # branches on what actually shipped so a one-package bump can't
      # collide with a stale tag from a prior multi-package run:
      #   cli shipped         → v$CLI_VERSION         (CLI is the user-facing
      #                                                 handle for `npx
      #                                                 openhop`, so its
      #                                                 version anchors the
      #                                                 combined release)
      #   server (± web)      → server/v$SERVER_VERSION (server is the lowest
      #                                                   layer and a more
      #                                                   meaningful anchor
      #                                                   than web when both
      #                                                   ship together)
      #   web only            → web/v$WEB_VERSION
      - name: Create tag + GitHub Release
        # Gate on actual step outcomes, not the pre-check intent — a failed
        # `npm publish` (network, auth, registry rejection) shouldn't still
        # produce a "successful publish" release record. `always()` keeps
        # this step eligible to run even though the upstream publish step
        # may have been conditionally skipped.
        if: |
          always() && (
            steps.publish_server.outcome == 'success' ||
            steps.publish_web.outcome == 'success' ||
            steps.publish_cli.outcome == 'success'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_VERSION: ${{ steps.versions.outputs.server }}
          WEB_VERSION: ${{ steps.versions.outputs.web }}
          CLI_VERSION: ${{ steps.versions.outputs.cli }}
          SERVER_PUBLISHED: ${{ steps.publish_server.outcome == 'success' }}
          WEB_PUBLISHED: ${{ steps.publish_web.outcome == 'success' }}
          CLI_PUBLISHED: ${{ steps.publish_cli.outcome == 'success' }}
        run: |
          if [ "$CLI_PUBLISHED" = "true" ]; then
            tag="v$CLI_VERSION"
          elif [ "$SERVER_PUBLISHED" = "true" ]; then
            # Covers server-only AND server+web combined runs.
            tag="server/v$SERVER_VERSION"
          else
            tag="web/v$WEB_VERSION"
          fi

          # If THIS tag already exists (re-run of a workflow whose tag
          # already landed), skip cleanly.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::release $tag already exists, skipping"
            exit 0
          fi

          {
            echo "## Published to npm"
            if [ "$SERVER_PUBLISHED" = "true" ]; then
              echo "- [\`@openhop/server@$SERVER_VERSION\`](https://www.npmjs.com/package/@openhop/server/v/$SERVER_VERSION)"
            fi
            if [ "$WEB_PUBLISHED" = "true" ]; then
              echo "- [\`@openhop/web@$WEB_VERSION\`](https://www.npmjs.com/package/@openhop/web/v/$WEB_VERSION)"
            fi
            if [ "$CLI_PUBLISHED" = "true" ]; then
              echo "- [\`openhop@$CLI_VERSION\`](https://www.npmjs.com/package/openhop/v/$CLI_VERSION)"
            fi
            echo
            echo "## Try it"
            echo '```sh'
            echo "npx openhop demo"
            echo '```'
            echo
            echo "Auto-generated notes (commit history) below."
          } > /tmp/release-body.md

          gh release create "$tag" \
            --title "$tag" \
            --notes-file /tmp/release-body.md \
            --generate-notes \
            --target "$GITHUB_SHA"
