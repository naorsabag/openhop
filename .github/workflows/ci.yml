name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs full history
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build --workspaces --if-present
      - run: npm test --workspaces --if-present

  coverage:
    name: test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - run: npm run test:coverage --workspaces --if-present
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage/

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit
      - name: test audit retry helper
        run: bash .github/scripts/npm-audit-with-retry.test.sh
      # Production tree: stricter — anything moderate+ ships to end users.
      - name: prod tree (moderate+)
        run: bash .github/scripts/npm-audit-with-retry.sh --omit=dev --audit-level=moderate
      # Full tree (incl. dev): looser — dev-only advisories don't reach
      # users, so block only on high+critical to avoid noise.
      - name: full tree (high+)
        run: bash .github/scripts/npm-audit-with-retry.sh --audit-level=high

  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action posts a summary comment on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
