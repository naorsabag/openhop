# CodeRabbit configuration. Schema: https://docs.coderabbit.ai/reference/yaml-template/
#
# OpenHop uses CodeRabbit for AI code review on every PR. Review behavior is
# tuned for a TypeScript monorepo with a CLI, server, and web app.

language: en

# Review profile:
#  - "chill"     — friendly, focuses on actionable feedback, ignores trivia
#  - "assertive" — flags style issues, opinionated about every diff
#
# We start in "chill" mode for a solo-dev velocity. Flip to "assertive"
# post-launch when we want stricter review during the contributor influx.
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false # don't review while still iterating on a draft PR
    base_branches:
      - master

  # Paths CodeRabbit should ignore. Build outputs, generated artifacts,
  # vendored dependencies. The skill copy in packages/cli/skills/ is
  # generated by `npm pack` (see prepack script) — never reviewed.
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!packages/cli/skills/**"
    - "!package-lock.json"

  # Per-area review hints. Lets CodeRabbit weight feedback differently
  # depending on which package the diff touches.
  path_instructions:
    - path: "packages/cli/**"
      instructions: |
        This is the user-facing CLI. The machine API contract is documented
        in openhop-launch/16-cli-as-universal-api.md. Flag any change that:
          - mixes data on stdout with logs/errors (only stdout for data)
          - uses ANSI escape codes in non-TTY paths
          - introduces a new exit code outside the documented set
            (0 success, 2 usage, 3 validation, 4 not-found, 5 conflict,
             6 network, 7 auth)
          - emits text from --json mode (must be pure JSON)
          - adds a new command without registering exitCodes + examples
            in src/help-json.ts COMMAND_META

    - path: "packages/server/**"
      instructions: |
        Fastify API. Validate request bodies via zod schemas in
        @openhop/shared. Return semantic HTTP statuses (400 validation,
        404 not-found, 409 conflict) — the CLI maps these to exit codes.

    - path: "packages/shared/**"
      instructions: |
        Zod is the source of truth. Any schema change ripples to the CLI,
        server, and JSON-Schema export. Don't hand-edit json-schema.ts —
        it's generated via toJSONSchema. New schemas must be added to
        sharedJsonSchemas in bootstrap.

    - path: "skills/openhop/**"
      instructions: |
        SKILL.md is the agent-facing instruction set. The `description:`
        field is the trigger phrase — changes there affect skill activation
        across Claude Code, Cursor, Windsurf, Cline. Be conservative.

    - path: "openhop-launch/**"
      instructions: |
        Launch planning docs. These describe target state, not current.
        Don't flag divergence from current code — divergence is expected.

# Chat behavior on the PR. Lets you type @coderabbitai for follow-up.
chat:
  auto_reply: true
